name: readme-sync
on:
  push:
    branches: [main]
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip readmeforge]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: haimhm/readmeforge-action@v1
        with:
          mode: pr
